<!doctype html>
<html lang=ca>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MyGymBro</title>
    <link rel="stylesheet" href="./css/estils.css">
    <script type="module" src="./js/main.js" defer></script>
</head>
<body>
    <header>
        <h1>MyGymBro</h1>
        <p>Planifica i personalitza la teua rutina d'entrenament</p>
    </header>
    <main id="aplicacio">
        <div class="principal">
            <section aria-labelledby="titol-cateleg">
                <h2 id="titol-cataleg">Tria el teus exericis</h2>
                <!-- Pose un div sinos al carregar el cataleg es borarria tot el de dalt -->
                <div id="cataleg" class="cataleg"></div>
            </section>

            <aside id="cistella-exercicis" aria-labelledby="titol-sessio">
                <h2 id="titol-sessio">La meua sessio d'entrenament</h2>
                <div id="sessio" class="sessio">
                    <ol id="llista-exercicis"></ol>
                    <div id="resum-aside" class="resum-aside">
                        <p><strong id="total-exercicis">0</strong> <span>exercicis</span></p>
                        <p><strong id="total-minuts">0</strong> <span>minuts</span></p>
                        <p><strong id="total-calories">0</strong> <span>calories</span></p>

                    </div>
                    <ul class="errors-sessio"></ul>
                </div>
            </aside>
        </div>
        <div class="inferior">
            <section aria-labelledby="titol-inscripcio">
                <h2 id="titol-inscripcio">Inscripció a la rutina</h2>
                <form id="formulari-inscripcio" novalidate>
                    <div class="camps">

                        <label for="form-nom">Nom: </label>
                        <input type="text" id="form-nom" name="nomRutina" minlength="3" maxlength="40" required>

                        <span class="error-missatge" id="error-nomRutina"></span>

                        <label for="form-codi">Codi curt de la rutina:</label>
                        <input type="text" id="form-codi" name="codiRutina" pattern="[a-zA-Z0-9\-]{3,12}" placeholder="Ex: RUT-NOV2026" required>
                        <span class="error-missatge" id="error-codiRutina"></span>

                        <label for="form-correu">Correu: </label>
                        <input type="email" id="form-correu" name="correuRutina"  required>

                        <span class="error-missatge" id="error-correuRutina"></span>

                        <label for="form-dies">Número de dies de la rutina</label>
                        <input type="number" id="form-dies" name="diesRutina"  min="1" max="7" required>

                        <span class="error-missatge" id="error-diesRutina"></span>

                        <fieldset aria-labelledby="forma-fisica">
                            <legend id="forma-fisica">Nivell de forma física: </legend>

                            <input type="radio" id="nivell-principal" name="nivellRutina" value="principiant" required>
                            <label for="nivell-principal">Principiant</label>

                            <input type="radio" id="nivell-intermedi" name="nivellRutina" value="intermediari">
                            <label for="nivell-intermedi">Intermedi</label>

                            <input type="radio" id="nivell-expert" name="nivellRutina" value="expert">
                            <label for="nivell-expert">Expert</label>

                            <span class="error-missatge" id="error-nivellRutina"></span>

                        </fieldset>
                        <label for="observacions">Observacions</label>
                        <textarea id="observacions" name="observacionsRutina" rows="2" aria-labelledby="error-observacions" ></textarea>
                        <span class="error-missatge" id="error-observacionsRutina"></span>

                        <input type="checkbox" id="acceptar-condicions" name="acceptarCondicions" required>
                        <label for="acceptar-condicions">Confirme que sóc responsable de la meua condició física en realitzar aquesta simulació.</label>

                        <span class="error-missatge" id="error-acceptarCondicions"></span>

                        <p id="resum-rutina"></p>
                        <p class="errors-sessio"></p>

                        <button type="submit" id="confirmar">Confirmar rutina i generar resum</button>


                    </div>
                </form>
                <!-- role:status per marcar regió que mostra un missatge -->
                <div id="resum" role="status"></div>

            </section>
        </div>
    </main>
    <footer></footer>
    <dialog id="detall" aria-labelledby="detall-titol">
        <button id="tancar-detall" type="button" aria-label="Tancar detall" title="Tancar detall">×</button>
        <img id="detall-imatge" alt="" />
        <h2 id="detall-titol"></h2>
        <p id="detall-text"></p>
        <p id="detall-dades"></p>
        <button id="detall-afegir" type="button">Afegir a la sessió</button>
    </dialog>
</body>
</html>
